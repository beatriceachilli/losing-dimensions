[project]
name = "latent-dim-diff"
version = "0.1.0"
description = "Latent dimensional diffusion project"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "numpy==1.24.2",
    "scipy==1.10.1",
    "pillow==10.2.0",
    "matplotlib==3.9.1",
    "tqdm==4.65.0",
    "diffusers==0.26.3",
    "huggingface-hub>=0.20.2,<0.26",
    "piqa==1.3.2",
    "simple-parsing==0.1.5",
    "einops==0.7.0",
    "ipykernel>=6.31.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
